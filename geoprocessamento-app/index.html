<!doctype html>
<html>
  <head>
    <title>Mapa Geoprocessamento</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h2>Mapa de Geoprocessamento</h2>

    <input type="file" id="fileInput" accept=".json,.geojson" />
    <button onclick="importarArquivo()">Importar GeoJSON</button>

    <div id="map" style="height: 500px;"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Leaflet Draw JS -->
    <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.geometryutil/0.9.3/leaflet.geometryutil.min.js"></script>

    <!-- Scripts personalizados -->
    <script src="script.js"></script>
    <script src="../JS/geometria.js"></script>
  </body>
</html>
